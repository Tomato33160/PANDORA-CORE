<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>PANDORA // VOID JUMPER : FULL ACCESS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #020205; overflow: hidden; font-family: 'Orbitron', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        /* On augmente la taille du Canvas pour plus d'espace */
        canvas { background: #000; border: 3px solid #00f2ff; box-shadow: 0 0 30px rgba(0, 242, 255, 0.5); max-height: 90vh; }
        #hud { color: #00f2ff; text-shadow: 0 0 10px #00f2ff; font-size: 1.5rem; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="hud">SECTEUR: <span id="sector-val">1</span> / 50</div>
    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // NOUVELLES DIMENSIONS : Plus haut pour mieux voir les portails
    canvas.width = 900; 
    canvas.height = 700; 

    const assets = { player: new Image(), bg: new Image(), goal: new Image() };
    assets.player.src = 'player.png';
    assets.bg.src = 'background.png';
    assets.goal.src = 'goal.png';

    let currentSector = 1;
    let platforms = [];
    let goal = { x: 0, y: 0, w: 70, h: 70 }; // Portail un peu plus grand
    
    const player = {
        x: 100, y: 300, w: 45, h: 45,
        vx: 0, vy: 0, grounded: false,
        speed: 0.9, jump: -13, friction: 0.85, gravity: 0.55
    };

    const keys = {};
    window.onkeydown = e => keys[e.key.toLowerCase()] = true;
    window.onkeyup = e => keys[e.key.toLowerCase()] = false;

    function generateLevel(lvl) {
        platforms = [];
        // Sol de départ large et sécurisé
        platforms.push({ x: 0, y: 620, w: 900, h: 80, c: '#00f2ff' });

        let lastY = 620;
        // Génération de 6 plateformes avec une hauteur contrôlée
        for(let i = 0; i < 6; i++) {
            let w = Math.max(90, 220 - (lvl * 2.5));
            let x = Math.random() * (canvas.width - w);
            // On s'assure que la plateforme ne monte pas trop haut trop vite
            let y = lastY - 95; 
            
            platforms.push({ x: x, y: y, w: w, h: 25, c: `hsl(${lvl * 25}, 100%, 60%)` });
            lastY = y;
        }

        // PLACEMENT DU PORTAIL : On le force à être VISIBLE (minimum y = 50)
        let topP = platforms[platforms.length - 1];
        goal.x = topP.x + (topP.w / 2) - 35;
        goal.y = Math.max(50, topP.y - 85); 
    }

    function update() {
        if (keys['d'] || keys['arrowright']) player.vx += player.speed;
        if (keys['q'] || keys['a'] || keys['arrowleft']) player.vx -= player.speed;
        if ((keys['z'] || keys['w'] || keys['arrowup'] || keys[' ']) && player.grounded) {
            player.vy = player.jump;
            player.grounded = false;
        }

        player.vy += player.gravity;
        player.vx *= player.friction;
        player.x += player.vx;
        player.y += player.vy;

        if (player.x < 0) player.x = 0;
        if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

        player.grounded = false;
        platforms.forEach(p => {
            if (player.x + player.w > p.x && player.x < p.x + p.w) {
                if (player.vy >= 0 && 
                    player.y + player.h >= p.y && 
                    player.y + player.h <= p.y + player.vy + 10) {
                    player.grounded = true;
                    player.vy = 0;
                    player.y = p.y - player.h;
                }
            }
        });

        // Victoire
        if (player.x < goal.x + goal.w && player.x + player.w > goal.x &&
            player.y < goal.y + goal.h && player.y + player.h > goal.y) {
            currentSector++;
            if (currentSector > 50) currentSector = 1;
            document.getElementById('sector-val').innerText = currentSector;
            resetPlayer();
            generateLevel(currentSector);
        }

        if (player.y > canvas.height + 100) resetPlayer();
    }

    function resetPlayer() {
        player.x = 100;
        player.y = 400;
        player.vx = 0;
        player.vy = 0;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (assets.bg.complete && assets.bg.naturalWidth !== 0) {
            ctx.drawImage(assets.bg, 0, 0, canvas.width, canvas.height);
        } else {
            ctx.fillStyle = "#050515"; ctx.fillRect(0,0,canvas.width,canvas.height);
        }

        platforms.forEach(p => {
            ctx.fillStyle = p.c + "66"; ctx.strokeStyle = p.c; ctx.lineWidth = 3;
            ctx.fillRect(p.x, p.y, p.w, p.h); ctx.strokeRect(p.x, p.y, p.w, p.h);
        });

        // Dessin du Portail (toujours prioritaire)
        if (assets.goal.complete && assets.goal.naturalWidth !== 0) {
            ctx.shadowBlur = 20; ctx.shadowColor = "#00f2ff";
            ctx.drawImage(assets.goal, goal.x, goal.y, goal.w, goal.h);
            ctx.shadowBlur = 0;
        } else {
            ctx.fillStyle = "#00f2ff"; ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
        }

        if (assets.player.complete && assets.player.naturalWidth !== 0) {
            ctx.drawImage(assets.player, player.x, player.y, player.w, player.h);
        } else {
            ctx.fillStyle = "#ff007f"; ctx.fillRect(player.x, player.y, player.w, player.h);
        }

        update();
        requestAnimationFrame(draw);
    }

    generateLevel(1);
    draw();
</script>
</body>
</html>
