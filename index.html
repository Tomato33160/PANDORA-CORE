<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>PANDORA MULTIVERSE // HORIZONTAL RUNNER</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        :root { --neon: #00f2ff; --pink: #ff007f; --bg: #050508; }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: #fff; font-family: 'Share Tech Mono', monospace; }

        .main { display: grid; grid-template-columns: 1fr 320px; height: 100vh; }
        #viewport { position: relative; overflow: hidden; border-right: 1px solid #222; display:flex; align-items:center; justify-content:center; }
        canvas { background: transparent; display: none; border-left: 6px solid #080810; }

        #ui { text-align:center; }
        #ui-title { font-family: 'Orbitron'; letter-spacing: 6px; margin-bottom: 20px; }
        .menu { display:flex; gap:12px; justify-content:center; }
        .btn { padding:18px 28px; background:#0a0a0f; border:1px solid #222; cursor:pointer; }

        #side { background:#08080c; display:flex; flex-direction:column; }
        #info { padding:18px; border-bottom:1px solid #222; }
        #controls { padding:12px; font-size:0.9rem; color:#cfcfcf; }

        #btn-back { display: none; position: absolute; top: 18px; left: 18px; color: var(--pink); cursor: pointer; z-index: 100; font-family: 'Orbitron'; }
    </style>
</head>
<body>

<div class="main">
    <div id="viewport">
        <div id="btn-back" onclick="location.reload()">[ QUITTER ]</div>

        <div id="ui">
            <h1 id="ui-title">PANDORA <span style="color:var(--neon)">RUNNER</span></h1>
            <div class="menu" id="ui-menu">
                <div class="btn" onclick="launchGame()">Lancer RUNNER</div>
                <div class="btn" style="opacity:0.4">Options</div>
            </div>
        </div>

        <canvas id="gameCanvas" width="900" height="500"></canvas>
    </div>

    <div id="side">
        <div id="info">
            <h3 style="margin:0; font-family:Orbitron">STATUS</h3>
            <div id="status-text">PRÊT</div>
        </div>
        <div id="controls">
            Contrôles: Flèches / A,D pour courir, Espace / Z pour sauter
            <br><br>
            Objectif: parcourir la plus grande distance possible — génération infinie horizontale.
        </div>
    </div>
</div>

<script>
// Simple horizontal infinite platformer
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Assets (PNGs existants)
const imgPlayer = new Image(); imgPlayer.src = 'player.png';
const imgBack = new Image(); imgBack.src = 'background.png';

// Game state
let cameraX = 0;
let distance = 0;
let gameOver = false;

// gameplay tuning
const MAX_GAP = 260; // pixels - maximum gap between platforms (keeps jumps possible)
const MIN_GAP = 40;
const MAX_PLATFORM_AHEAD = 2000;

const player = {
    x: 120, y: H - 120, w: 48, h: 48,
    vx: 0, vy: 0, grounded: false,
    speed: 0.45, runSpeed: 4.5, jump: -12, gravity: 0.6
};

let platforms = [];
let obstacles = [];
const keys = {};

function init() {
    cameraX = 0; distance = 0; gameOver = false;
    player.x = 120; player.y = H - 120; player.vx = 0; player.vy = 0; player.grounded = false;
    platforms = [];
    obstacles = [];
    // ground
    platforms.push({x: -1000, y: H-60, w: 3000, h: 60});
    // initial platforms
    let px = 300;
    for(let i=0;i<8;i++){
        const w = 80 + Math.random()*160;
        const gap = Math.min(MAX_GAP, MIN_GAP + Math.random()*200);
        const py = H-120 - Math.random()*120;
        platforms.push({x: px, y: py, w: w, h: 16});
        if(Math.random() > 0.55) addRandomObstacle(px, w, py);
        px += w + gap;
    }
}

function spawnAhead() {
    // ensure platforms ahead up to cameraX + 2000
    let maxX = Math.max(...platforms.map(p=>p.x+p.w));
    while(maxX < cameraX + MAX_PLATFORM_AHEAD) {
        const w = 80 + Math.random()*200;
        const gap = Math.min(MAX_GAP, MIN_GAP + Math.random()*220);
        const y = H - 120 - Math.random()*160;
        const nx = maxX + gap;
        platforms.push({x:nx, y:y, w:w, h:16});
        if(Math.random() > 0.5) addRandomObstacle(nx, w, y);
        maxX = nx + w;
    }
}

function addRandomObstacle(platformX, platformW, platformY) {
    // place obstacles relative to a platform
    const types = ['spike','saw','drone','laser','falling'];
    const t = types[Math.floor(Math.random()*types.length)];
    const baseX = platformX + Math.random() * platformW;
    const baseY = platformY - 24;
    switch(t) {
        case 'spike':
            obstacles.push({type:'spike', x: baseX, y: baseY+8, w: 28, h: 16});
            break;
        case 'saw':
            obstacles.push({type:'saw', x: baseX, y: baseY - 6, r: 14, ang: 0, vx: 0, vy: 0});
            break;
        case 'drone':
            obstacles.push({type:'drone', x: baseX, y: baseY - 40, w: 36, h: 20, amp: 20 + Math.random()*40, phase: Math.random()*Math.PI*2, speed: 0.02 + Math.random()*0.04});
            break;
        case 'laser':
            obstacles.push({type:'laser', x: baseX, y: baseY - 80, w: 6, h: 80, on: Math.random()>0.5, timer: Math.random()*120});
            break;
        case 'falling':
            obstacles.push({type:'falling', x: baseX, y: baseY - 200, w: 26, h: 26, vy:0, triggered:false});
            break;
    }
}

function update() {
    if(gameOver) return;

    const left = keys['a'] || keys['arrowleft'];
    const right = keys['d'] || keys['arrowright'];
    const jump = keys[' '] || keys['z'] || keys['arrowup'];

    // Horizontal movement (player tries to run to the right automatically slowly)
    if(right) player.vx += player.speed;
    if(left) player.vx -= player.speed;
    // apply friction
    player.vx *= 0.92;

    // Jump
    if(jump && player.grounded) { player.vy = player.jump; player.grounded = false; }

    player.vy += player.gravity;
    player.x += player.vx;
    player.y += player.vy;

    // Camera follows to the right based on distance
    const center = player.x - 200;
    if(center > cameraX) cameraX = center;

    // Collisions with platforms
    player.grounded = false;
    for(const p of platforms) {
        if(player.vy >= 0 && player.x + player.w > p.x && player.x < p.x + p.w) {
            if(player.y + player.h >= p.y && player.y + player.h <= p.y + player.vy + 12) {
                player.grounded = true; player.vy = 0; player.y = p.y - player.h;
            }
        }
    }

    // Obstacles behavior & collision
    for(const o of obstacles) {
        if(o.type === 'saw') {
            o.ang += 0.25;
        } else if(o.type === 'drone') {
            o.phase += o.speed;
            o.y = (o.y) + Math.sin(o.phase) * 0.5; // small bobbing
        } else if(o.type === 'laser') {
            o.timer = (o.timer + 1) % 180;
            o.on = o.timer < 90;
        } else if(o.type === 'falling') {
            if(!o.triggered && player.x > o.x - 120 && player.x < o.x + 120) o.triggered = true;
            if(o.triggered) o.vy += 0.8, o.y += o.vy;
        }

        // generic AABB collision checks depending on type
        if(o.type === 'saw') {
            const sx = o.x - o.r, sy = o.y - o.r, sw = o.r*2, sh = o.r*2;
            if(aabbCollision(player.x, player.y, player.w, player.h, sx, sy, sw, sh)) die();
        } else if(o.type === 'drone') {
            if(aabbCollision(player.x, player.y, player.w, player.h, o.x, o.y, o.w, o.h)) die();
        } else if(o.type === 'spike' || o.type === 'falling') {
            if(aabbCollision(player.x, player.y, player.w, player.h, o.x, o.y, o.w, o.h)) die();
        } else if(o.type === 'laser') {
            if(o.on) {
                if(aabbCollision(player.x, player.y, player.w, player.h, o.x, o.y, o.w, o.h)) die();
            }
        }
    }

    // Remove old platforms and obstacles behind
    platforms = platforms.filter(p => p.x + p.w > cameraX - 500);
    obstacles = obstacles.filter(o => o.x + o.w > cameraX - 500);

    // spawn new
    spawnAhead();

    // update distance
    distance = Math.max(distance, Math.floor(cameraX));

    // falling check
    if(player.y > H + 200) die();
}

function die() {
    gameOver = true;
    document.getElementById('status-text').innerText = 'GAME OVER — distance: ' + Math.floor(distance) + 'm';
    setTimeout(()=>{ init(); document.getElementById('status-text').innerText = 'PRÊT'; gameOver = false; }, 1500);
}

function aabbCollision(x1,y1,w1,h1, x2,y2,w2,h2){
    return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
}

function draw() {
    if(canvas.style.display === 'none') return;
    ctx.clearRect(0,0,W,H);

    // background
    if(imgBack.complete && imgBack.naturalWidth>0) {
        // tile background
        const sx = Math.floor(cameraX/4) % 1200;
        for(let i=-2;i<4;i++) ctx.drawImage(imgBack, -sx + i*1200, 0, 1200, H);
    } else {
        ctx.fillStyle = '#081018'; ctx.fillRect(0,0,W,H);
    }

    ctx.save();
    ctx.translate(-cameraX, 0);

    // platforms
    for(const p of platforms) {
        ctx.fillStyle = '#222';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.strokeStyle = '#333'; ctx.strokeRect(p.x, p.y, p.w, p.h);
    }

    // obstacles rendering
    for(const o of obstacles) {
        if(o.type === 'spike') {
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath(); ctx.moveTo(o.x, o.y+o.h); ctx.lineTo(o.x+o.w/2, o.y); ctx.lineTo(o.x+o.w, o.y+o.h); ctx.closePath(); ctx.fill();
        } else if(o.type === 'saw') {
            ctx.save(); ctx.translate(o.x, o.y);
            ctx.rotate(o.ang);
            ctx.fillStyle = '#bbbbbb'; ctx.beginPath(); ctx.arc(0,0,o.r,0,Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-o.r,0); ctx.lineTo(o.r,0); ctx.stroke();
            ctx.restore();
        } else if(o.type === 'drone') {
            ctx.fillStyle = '#66ddff'; ctx.fillRect(o.x, o.y, o.w, o.h);
            ctx.fillStyle = '#004'; ctx.fillRect(o.x+6, o.y+4, o.w-12, o.h-6);
        } else if(o.type === 'laser') {
            ctx.fillStyle = o.on ? 'rgba(255,30,30,0.9)' : 'rgba(255,30,30,0.25)';
            ctx.fillRect(o.x, o.y, o.w, o.h);
        } else if(o.type === 'falling') {
            ctx.fillStyle = '#996633'; ctx.fillRect(o.x, o.y, o.w, o.h);
        } else {
            ctx.fillStyle = '#ff0044'; ctx.fillRect(o.x, o.y, o.w, o.h);
        }
    }

    // player
    if(imgPlayer.complete && imgPlayer.naturalWidth>0) {
        ctx.drawImage(imgPlayer, player.x, player.y, player.w, player.h);
    } else {
        ctx.fillStyle = '#ff007f'; ctx.fillRect(player.x, player.y, player.w, player.h);
    }

    ctx.restore();

    // HUD
    ctx.fillStyle = 'white'; ctx.font = '18px Share Tech Mono';
    ctx.fillText('DISTANCE: ' + Math.floor(distance) + 'm', 16, 28);

    update();
    requestAnimationFrame(draw);
}

window.addEventListener('keydown', (e)=>{ keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', (e)=>{ keys[e.key.toLowerCase()] = false; });

function launchGame(){
    document.getElementById('ui-menu').style.display = 'none';
    document.getElementById('ui-title').style.display = 'none';
    canvas.style.display = 'block';
    document.getElementById('btn-back').style.display = 'block';
    init(); draw();
}

// expose init for hot-reload during development
window.__initGame = init;
</script>

</body>
</html>
