<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>PANDORA MULTIVERSE // STABLE V3</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --pink: #ff007f; --bg: #050508; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: #fff; font-family: 'Share Tech Mono', monospace; overflow: hidden; }

        /* LAYOUT */
        .main-container { display: grid; grid-template-columns: 1fr 350px; height: 100vh; }

        /* MILIEU : MENU & JEU */
        #viewport { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 1px solid #222; background: radial-gradient(circle, #101015 0%, #000 100%); }
        canvas { background: #000; border: 2px solid var(--neon); display: none; cursor: none; }
        
        .game-grid { display: grid; grid-template-columns: repeat(2, 200px); gap: 20px; }
        .card { width: 200px; height: 120px; background: #0a0a0f; border: 1px solid #333; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .card:hover { border-color: var(--neon); box-shadow: 0 0 15px var(--neon); }
        .locked { opacity: 0.4; cursor: not-allowed; border-style: dashed; }

        /* DROITE : CHAT */
        #side-chat { display: flex; flex-direction: column; background: #08080c; border-left: 1px solid #222; }
        .chat-tabs { display: flex; border-bottom: 1px solid #222; }
        .tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; font-size: 0.7rem; font-family: 'Orbitron'; }
        .tab.active { color: var(--neon); border-bottom: 2px solid var(--neon); background: #10101a; }
        
        #chat-msgs { flex: 1; overflow-y: auto; padding: 15px; font-size: 0.8rem; }
        .msg { margin-bottom: 8px; border-bottom: 1px solid #111; padding-bottom: 4px; }
        .msg b { color: var(--neon); }
        .private-tag { color: var(--pink); font-size: 0.6rem; border: 1px solid var(--pink); padding: 1px 3px; margin-right: 5px; }

        .chat-ctrl { padding: 15px; border-top: 1px solid #222; background: #050508; }
        input { width: 100%; background: #000; border: 1px solid #333; color: #fff; padding: 8px; font-family: 'Share Tech Mono'; outline: none; margin-bottom: 5px; }
        
        #btn-back { display: none; position: absolute; top: 20px; left: 20px; color: var(--pink); cursor: pointer; z-index: 10; }
    </style>
</head>
<body>

<div class="main-container">
    <div id="viewport">
        <div id="btn-back" onclick="location.reload()">[ QUITTER LE JEU ]</div>
        
        <h1 id="ui-title" style="font-family:'Orbitron';">PANDORA <span style="color:var(--neon)">OS</span></h1>
        
        <div class="game-grid" id="ui-menu">
            <div class="card" onclick="launchGame()">
                <span style="font-size:1.5rem">🚀</span>
                <h3 style="font-family:'Orbitron'; font-size:0.7rem">VOID JUMPER</h3>
            </div>
            <div class="card locked"><span>⚔️</span><h3 style="font-size:0.7rem">DATA WARS</h3></div>
            <div class="card locked"><span>🚗</span><h3 style="font-size:0.7rem">NEON DRIFT</h3></div>
            <div class="card locked"><span>🦠</span><h3 style="font-size:0.7rem">GLITCH HUNT</h3></div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="side-chat">
        <div class="chat-tabs">
            <div class="tab active" id="t-pub" onclick="setChat('public')">PUBLIC</div>
            <div class="tab" id="t-priv" onclick="setChat('private')">PRIVE</div>
        </div>
        <div id="chat-msgs">
            <div class="msg"><b>[SYS]</b> Connecté au Nexus Pandora.</div>
        </div>
        <div class="chat-ctrl">
            <input type="text" id="session-code" placeholder="CODE SESSION (Ex: 1234)" style="font-size:0.6rem; border-color:var(--pink); display:none;">
            <input type="text" id="chat-in" placeholder="Message...">
        </div>
    </div>
</div>

<script>
    // --- GESTION CHAT & SESSION ---
    let chatMode = 'public';
    const chatIn = document.getElementById('chat-in');
    const chatMsgs = document.getElementById('chat-msgs');
    const sessionIn = document.getElementById('session-code');

    function setChat(mode) {
        chatMode = mode;
        document.getElementById('t-pub').className = mode === 'public' ? 'tab active' : 'tab';
        document.getElementById('t-priv').className = mode === 'private' ? 'tab active' : 'tab';
        sessionIn.style.display = mode === 'private' ? 'block' : 'none';
    }

    chatIn.onkeydown = (e) => {
        if(e.key === 'Enter' && chatIn.value !== "") {
            let prefix = chatMode === 'private' ? `<span class="private-tag">SESS:${sessionIn.value || '????'}</span>` : '';
            chatMsgs.innerHTML += `<div class="msg">${prefix}<b>Moi:</b> ${chatIn.value}</div>`;
            chatIn.value = "";
            chatMsgs.scrollTop = chatMsgs.scrollHeight;
        }
    };

    // --- MOTEUR DE JEU (VOID JUMPER) ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 800; canvas.height = 600;

    const imgP = new Image(); imgP.src = 'player.png';
    const imgB = new Image(); imgB.src = 'background.png';

    let currentLvl = 1;
    let platforms = [];
    let goal = {x:0, y:0, w:60, h:60};
    
    const player = {
        x:100, y:400, w:45, h:45, vx:0, vy:0,
        grounded: false, speed:0.9, jump:-13, gravity:0.55, friction:0.85
    };

    const keys = {};
    window.onkeydown = (e) => { 
        keys[e.key.toLowerCase()] = true;
        // Empêche le scroll avec les flèches pendant qu'on joue
        if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
    };
    window.onkeyup = (e) => { keys[e.key.toLowerCase()] = false; };

    function generate(lvl) {
        platforms = [{x:0, y:550, w:800, h:50, c:'#00f2ff'}];
        let ly = 550;
        for(let i=0; i<7; i++) {
            let w = Math.max(80, 200 - (lvl*2));
            let x = Math.random()*(800-w);
            let y = ly - 85;
            platforms.push({x, y, w, h:20, c:`hsl(${lvl*20}, 100%, 60%)`});
            ly = y;
        }
        goal.x = platforms[7].x + 10;
        goal.y = platforms[7].y - 100;
    }

    function update() {
        if(keys['d'] || keys['arrowright']) player.vx += player.speed;
        if(keys['q'] || keys['a'] || keys['arrowleft']) player.vx -= player.speed;
        if((keys['z'] || keys['w'] || keys['arrowup'] || keys[' ']) && player.grounded) {
            player.vy = player.jump;
            player.grounded = false;
        }

        player.vy += player.gravity;
        player.vx *= player.friction;
        player.x += player.vx;
        player.y += player.vy;

        if(player.x < 0) player.x = 0;
        if(player.x + player.w > 800) player.x = 800 - player.w;

        player.grounded = false;
        platforms.forEach(p => {
            if(player.x+player.w > p.x && player.x < p.x+p.w && player.vy >= 0 &&
               player.y+player.h >= p.y && player.y+player.h <= p.y + player.vy + 10) {
                player.grounded = true; player.vy = 0; player.y = p.y - player.h;
            }
        });

        if(player.x < goal.x+60 && player.x+45 > goal.x && player.y < goal.y+60 && player.y+45 > goal.y) {
            currentLvl++;
            generate(currentLvl);
            player.x=100; player.y=400;
        }
        if(player.y > 700) { player.x=100; player.y=400; player.vx=0; player.vy=0; }
    }

    function draw() {
        if(canvas.style.display === 'none') return;
        ctx.clearRect(0,0,800,600);
        
        if(imgB.complete && imgB.naturalWidth !== 0) ctx.drawImage(imgB, 0, 0, 800, 600);
        
        platforms.forEach(p => {
            ctx.fillStyle = p.c+"44"; ctx.strokeStyle = p.c;
            ctx.fillRect(p.x, p.y, p.w, p.h); ctx.strokeRect(p.x, p.y, p.w, p.h);
        });

        ctx.fillStyle = varColor = "#00f2ff";
        ctx.strokeRect(goal.x, goal.y, 60, 60);

        if(imgP.complete && imgP.naturalWidth !== 0) {
            ctx.drawImage(imgP, player.x, player.y, player.w, player.h);
        } else {
            ctx.fillStyle = "#ff007f"; ctx.fillRect(player.x, player.y, player.w, player.h);
        }

        update();
        requestAnimationFrame(draw);
    }

    function launchGame() {
        document.getElementById('ui-menu').style.display = 'none';
        document.getElementById('ui-title').style.display = 'none';
        canvas.style.display = 'block';
        document.getElementById('btn-back').style.display = 'block';
        generate(1);
        draw();
        canvas.focus(); // TRÈS IMPORTANT : donne le focus au jeu pour bouger
    }
</script>
</body>
</html>
