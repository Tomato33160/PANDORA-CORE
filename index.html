<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>PANDORA MULTIVERSE // PORTAL FIX</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --pink: #ff007f; --bg: #050508; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: #fff; font-family: 'Share Tech Mono', monospace; overflow: hidden; }
        .main-container { display: grid; grid-template-columns: 1fr 350px; height: 100vh; }
        #viewport { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 1px solid #222; }
        canvas { background: #000; border: 2px solid var(--neon); display: none; }
        .game-grid { display: grid; grid-template-columns: repeat(2, 200px); gap: 20px; }
        .card { width: 200px; height: 120px; background: #0a0a0f; border: 1px solid #333; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .card:hover { border-color: var(--neon); box-shadow: 0 0 15px var(--neon); }
        #side-chat { display: flex; flex-direction: column; background: #08080c; border-left: 1px solid #222; }
        .chat-tabs { display: flex; border-bottom: 1px solid #222; }
        .tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; font-family: 'Orbitron'; font-size: 0.7rem; }
        .tab.active { color: var(--neon); border-bottom: 2px solid var(--neon); }
        #chat-msgs { flex: 1; overflow-y: auto; padding: 15px; font-size: 0.8rem; }
        .chat-ctrl { padding: 15px; border-top: 1px solid #222; }
        input { width: 100%; background: #000; border: 1px solid #333; color: #fff; padding: 8px; font-family: 'Share Tech Mono'; outline: none; }
        #btn-back { display: none; position: absolute; top: 20px; left: 20px; color: var(--pink); cursor: pointer; }
    </style>
</head>
<body>

<div class="main-container">
    <div id="viewport">
        <div id="btn-back" onclick="location.reload()">[ RETOUR MENU ]</div>
        <h1 id="ui-title" style="font-family:'Orbitron';">PANDORA <span style="color:var(--neon)">OS</span></h1>
        <div class="game-grid" id="ui-menu">
            <div class="card" onclick="launchGame()">
                <span style="font-size:1.5rem">🚀</span>
                <h3 style="font-family:'Orbitron'; font-size:0.7rem">VOID JUMPER</h3>
            </div>
            <div class="card" style="opacity:0.3"><h3>WIP</h3></div>
            <div class="card" style="opacity:0.3"><h3>WIP</h3></div>
            <div class="card" style="opacity:0.3"><h3>WIP</h3></div>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="side-chat">
        <div class="chat-tabs">
            <div class="tab active" id="t-pub" onclick="setChat('public')">PUBLIC</div>
            <div class="tab" id="t-priv" onclick="setChat('private')">PRIVÉ</div>
        </div>
        <div id="chat-msgs"></div>
        <div class="chat-ctrl">
            <input type="text" id="session-code" placeholder="CODE SESSION" style="display:none; margin-bottom:5px; border-color:var(--pink);">
            <input type="text" id="chat-in" placeholder="Message...">
        </div>
    </div>
</div>

<script>
    // --- CHAT LOGIC ---
    let chatMode = 'public';
    function setChat(m) {
        chatMode = m;
        document.getElementById('t-pub').className = m === 'public' ? 'tab active' : 'tab';
        document.getElementById('t-priv').className = m === 'private' ? 'tab active' : 'tab';
        document.getElementById('session-code').style.display = m === 'private' ? 'block' : 'none';
    }

    // --- GAME LOGIC ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 800; canvas.height = 600;

    const imgP = new Image(); imgP.src = 'player.png';
    const imgB = new Image(); imgB.src = 'background.png';
    const imgG = new Image(); imgG.src = 'goal.png'; // Optionnel

    let currentLvl = 1;
    let platforms = [];
    let goal = {x:0, y:0, w:60, h:60};
    const player = { x:100, y:400, w:45, h:45, vx:0, vy:0, grounded: false };

    const keys = {};
    window.onkeydown = (e) => { keys[e.key.toLowerCase()] = true; if(canvas.style.display === 'block') e.preventDefault(); };
    window.onkeyup = (e) => { keys[e.key.toLowerCase()] = false; };

    function generate(lvl) {
        platforms = [{x:0, y:550, w:800, h:50, c:'#00f2ff'}];
        let ly = 550;
        for(let i=0; i<7; i++) {
            let w = 150 - (lvl * 1.5);
            let x = Math.random()*(800-w);
            let y = ly - 82;
            platforms.push({x, y, w, h:20, c:`hsl(${lvl*20}, 100%, 60%)`});
            ly = y;
        }
        // Placement du portail au dessus de la dernière plateforme
        let topP = platforms[platforms.length - 1];
        goal.x = topP.x + (topP.w/2) - 30;
        goal.y = topP.y - 110;
    }

    function update() {
        if(keys['d'] || keys['arrowright']) player.vx += 0.8;
        if(keys['q'] || keys['a'] || keys['arrowleft']) player.vx -= 0.8;
        if((keys['z'] || keys['w'] || keys['arrowup'] || keys[' ']) && player.grounded) {
            player.vy = -13;
            player.grounded = false;
        }

        player.vy += 0.55;
        player.vx *= 0.85;
        player.x += player.vx;
        player.y += player.vy;

        if(player.x < 0) player.x = 0;
        if(player.x + player.w > 800) player.x = 800 - player.w;

        player.grounded = false;
        platforms.forEach(p => {
            if(player.x + player.w > p.x && player.x < p.x + p.w &&
               player.y + player.h >= p.y && player.y + player.h <= p.y + player.vy + 10 && player.vy >= 0) {
                player.grounded = true; player.vy = 0; player.y = p.y - player.h;
            }
        });

        // Collision Portail
        if(player.x < goal.x + 60 && player.x + 45 > goal.x && player.y < goal.y + 60 && player.y + 45 > goal.y) {
            currentLvl++;
            generate(currentLvl);
            player.x = 100; player.y = 400;
        }
        if(player.y > 650) { player.x = 100; player.y = 400; player.vx = 0; player.vy = 0; }
    }

    function draw() {
        if(canvas.style.display !== 'block') return;
        ctx.clearRect(0,0,800,600);
        
        // Background
        if(imgB.complete && imgB.naturalWidth > 0) {
            ctx.drawImage(imgB, 0, 0, 800, 600);
        } else {
            ctx.fillStyle = "#050510"; ctx.fillRect(0,0,800,600);
        }
        
        // Plateformes
        platforms.forEach(p => {
            ctx.fillStyle = p.c + "44"; ctx.strokeStyle = p.c;
            ctx.fillRect(p.x, p.y, p.w, p.h); ctx.strokeRect(p.x, p.y, p.w, p.h);
        });

        // LE PORTAIL (Affichage forcé)
        ctx.fillStyle = "rgba(255, 255, 0, 0.2)";
        ctx.strokeStyle = "#ffff00";
        ctx.lineWidth = 3;
        ctx.shadowBlur = 15; ctx.shadowColor = "#ffff00";
        ctx.beginPath();
        ctx.arc(goal.x + 30, goal.y + 30, 25, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Player
        if(imgP.complete && imgP.naturalWidth > 0) {
            ctx.drawImage(imgP, player.x, player.y, player.w, player.h);
        } else {
            ctx.fillStyle = "#ff007f"; ctx.fillRect(player.x, player.y, player.w, player.h);
        }

        update();
        requestAnimationFrame(draw);
    }

    function launchGame() {
        document.getElementById('ui-menu').style.display = 'none';
        document.getElementById('ui-title').style.display = 'none';
        canvas.style.display = 'block';
        document.getElementById('btn-back').style.display = 'block';
        generate(1);
        draw();
    }
</script>
</body>
</html>
