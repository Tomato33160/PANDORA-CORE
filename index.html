<!DOCTYPE html>
<html>
<head>
    <title>VOID JUMPER // LAB VERSION</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { border: 2px solid #00f2ff; box-shadow: 0 0 30px rgba(0, 242, 255, 0.3); }
        .ui { position: absolute; top: 20px; left: 20px; font-family: 'Orbitron', sans-serif; color: #00f2ff; text-shadow: 0 0 10px #00f2ff; pointer-events: none; }
    </style>
</head>
<body>
    <div class="ui">MODE: EXPERIMENTAL_STATION // ALT: <span id="alt">0</span>m</div>
    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 800; canvas.height = 600;

    // --- CHARGEMENT DES ASSETS ---
    const imgPlayer = new Image();
    imgPlayer.src = 'player.png';
    const imgBg = new Image();
    imgBg.src = 'background.png';

    // --- PHYSIQUE & JOUEUR ---
    const config = { gravity: 0.45, friction: 0.85, jumpForce: -11, speed: 0.9 };
    const player = {
        x: 100, y: 500, w: 50, h: 50, // Ajuste la taille selon ton image
        vx: 0, vy: 0, grounded: false, facingRight: true
    };

    const platforms = [
        {x: 0, y: 560, w: 800, h: 40}, 
        {x: 250, y: 440, w: 200, h: 20},
        {x: 500, y: 320, w: 200, h: 20},
        {x: 150, y: 220, w: 150, h: 20},
        {x: 400, y: 100, w: 300, h: 20}
    ];

    const keys = {};
    window.onkeydown = e => keys[e.key.toLowerCase()] = true;
    window.onkeyup = e => keys[e.key.toLowerCase()] = false;

    function update() {
        if (keys['d'] || keys['arrowright']) { 
            player.vx += config.speed; 
            player.facingRight = true;
        }
        if (keys['q'] || keys['a'] || keys['arrowleft']) { 
            player.vx -= config.speed; 
            player.facingRight = false;
        }
        if ((keys[' '] || keys['z'] || keys['arrowup']) && player.grounded) {
            player.vy = config.jumpForce;
            player.grounded = false;
        }

        player.vy += config.gravity;
        player.x += player.vx;
        player.y += player.vy;
        player.vx *= config.friction;

        // Limites et collisions
        player.grounded = false;
        platforms.forEach(p => {
            if (player.x + player.w > p.x && player.x < p.x + p.w &&
                player.y + player.h > p.y && player.y + player.h < p.y + p.vy + 10) {
                player.grounded = true;
                player.vy = 0;
                player.y = p.y - player.h;
            }
        });

        document.getElementById('alt').innerText = Math.round(600 - player.y);
    }

    function draw() {
        // 1. Dessiner le Background (Image)
        if (imgBg.complete) {
            ctx.drawImage(imgBg, 0, 0, canvas.width, canvas.height);
        } else {
            ctx.fillStyle = '#050510'; ctx.fillRect(0,0,800,600);
        }

        // 2. Dessiner les plateformes (effet néon)
        ctx.fillStyle = "rgba(0, 242, 255, 0.2)";
        ctx.strokeStyle = "#00f2ff";
        ctx.lineWidth = 2;
        platforms.forEach(p => {
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.strokeRect(p.x, p.y, p.w, p.h);
        });

        // 3. Dessiner le Joueur (Image)
        if (imgPlayer.complete) {
            ctx.save();
            // Petit effet de miroir si on va à gauche
            if (!player.facingRight) {
                ctx.translate(player.x + player.w, player.y);
                ctx.scale(-1, 1);
                ctx.drawImage(imgPlayer, 0, 0, player.w, player.h);
            } else {
                ctx.drawImage(imgPlayer, player.x, player.y, player.w, player.h);
            }
            ctx.restore();
        } else {
            ctx.fillStyle = "#ff007f"; ctx.fillRect(player.x, player.y, player.w, player.h);
        }

        requestAnimationFrame(() => { update(); draw(); });
    }

    draw();
</script>
</body>
</html>
